# We have a conf and classes directory, add to BBPATH
BBPATH =. "${LAYERDIR}:"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "wr-microchip-pic64gx"
BBFILE_PATTERN_wr-microchip-pic64gx = "^${LAYERDIR}/"
BBFILE_PRIORITY_wr-microchip-pic64gx = "7"

LAYERVERSION_wr-microchip-pic64gx = "1"
LAYERDEPENDS_wr-microchip-pic64gx = "core wrlinux meta-mchp-common meta-mchp-pic64-bsp"
LAYERSERIES_COMPAT_wr-microchip-pic64gx = "wrl wrynose"
