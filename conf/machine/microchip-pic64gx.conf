#@TYPE: Machine
#@NAME: microchip-pic64gx
#@SOC: PIC64GX SoC
#@DESCRIPTION: Machine configuration for the Microchip PIC64GX1000 Curiosity Kit

DEFAULTTUNE = "riscv64"

require include/mpfs-common-machine-configuration.inc

BSP_MCHP_DERIVED:append = " microchip-pic64gx"

RISCV_SBI_FDT ?=  "pic64gx-curiosity-kit.dtb"
KERNEL_DTC_FLAGS += "-@"
KERNEL_DEVICETREE ?= "microchip/${RISCV_SBI_FDT}"

PREFERRED_PROVIDER_virtual/kernel ??= "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.18%"

UBOOT_MACHINE = "microchip_pic64gx_curiosity_kit_defconfig"

## Generate a boot.scr file which should be included
###  in the boot partition. It will try to load a kernel image from mmc
UBOOT_ENV = "boot"
UBOOT_ENV_SUFFIX = "scr"
UBOOT_ENV_SIZE = "0x2000"

HSS_PAYLOAD = "uboot"

IMAGE_BOOT_FILES ?= " \
    fitImage \
    boot.scr \
    uboot.env \
"

WKS_FILE ?= "pic64gx-rootfs.wks"

MACHINEOVERRIDES =. "pic64gx-curiosity-kit:"
MACHINEOVERRIDES .= ":pic64gx"
